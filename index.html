<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Puzzle Arena</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!--
      Puzzle Arena page: the game fills the whole window; a slim bar at the bottom holds a Fullscreen button.
      (For Poki the page is generated by Poki's loader; this template is for the test build and for self-hosting.)
    -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #111111; overflow: hidden; }
      body { display: flex; flex-direction: column; font-family: Arial, Helvetica, sans-serif; }

      #game { position: relative; flex: 1 1 auto; min-height: 0; }
      #unity-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #111111; } /* sized by fit() below */

      /* loading bar (centered) */
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
      #unity-logo { width: 154px; height: 130px; background: url('TemplateData/unity-logo-dark.png') no-repeat center; margin: 0 auto; }
      #unity-progress-bar-empty { width: 141px; height: 18px; margin: 10px auto 0 auto; background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center; }
      #unity-progress-bar-full { width: 0%; height: 18px; background: url('TemplateData/progress-bar-full-dark.png') no-repeat center; }

      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; z-index: 5; }

      /* bottom bar */
      #bar { flex: 0 0 auto; height: 38px; display: flex; align-items: center; justify-content: center; background: #1b1b1b; border-top: 1px solid #2a2a2a; }
      #fs-button {
        font: 600 13px Arial, Helvetica, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
        color: #f2f2f2; background: #2c2c2c; border: 1px solid #444; border-radius: 999px;
        padding: 6px 18px; cursor: pointer; display: none;
      }
      #fs-button:hover { background: #3a3a3a; }
      #fs-button:active { background: #4c8dff; border-color: #4c8dff; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <div id="bar">
      <button id="fs-button" type="button">Fullscreen</button>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Fullscreen toggle for the whole page (so the bar and the game both stay visible and the canvas just grows).
      (function () {
        var btn = document.querySelector("#fs-button");
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!request || !exit) return; // e.g. iPhone Safari: no fullscreen API, keep the button hidden
        btn.style.display = "inline-block";
        function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
        function sync() { btn.textContent = isFs() ? "Exit fullscreen" : "Fullscreen"; }
        btn.onclick = function () {
          if (isFs()) exit.call(document); else request.call(root);
        };
        document.addEventListener("fullscreenchange", sync);
        document.addEventListener("webkitfullscreenchange", sync);
      })();

      // Keep the game area between 9:16 and 16:9, centred (the same limits Poki's config uses: maxRatio 16/9, minRatio 9/16).
      // The layouts are designed for that range; a wider window gets bars at the sides instead of a stretched layout.
      (function () {
        var MAX = 16 / 9, MIN = 9 / 16;
        var game = document.querySelector("#game");
        function fit() {
          var W = game.clientWidth, H = game.clientHeight;
          if (W < 2 || H < 2) return;
          var w = W, h = H, r = W / H;
          if (r > MAX) w = Math.round(H * MAX);
          else if (r < MIN) h = Math.round(W / MIN);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          canvas.style.left = Math.round((W - w) / 2) + "px";
          canvas.style.top = Math.round((H - h) / 2) + "px";
        }
        window.addEventListener("resize", fit);
        document.addEventListener("fullscreenchange", function () { setTimeout(fit, 50); });
        document.addEventListener("webkitfullscreenchange", function () { setTimeout(fit, 50); });
        fit();
      })();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/PagesWebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/PagesWebGL.data",
        frameworkUrl: buildUrl + "/PagesWebGL.framework.js",
        codeUrl: buildUrl + "/PagesWebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Puzzle Arena",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Unity keeps the render target matched to the canvas size in the page (scaled by devicePixelRatio), so the game
      // follows the window and the fullscreen change on its own.

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
